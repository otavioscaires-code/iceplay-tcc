<style>text{font-family:Arial,sans-serif;fill:#152332} .title{font-size:23px;font-weight:bold} .heading{font-size:17px;font-weight:bold} .body{font-size:15px} .note{font-size:13px;fill:#46566a} .edge{fill:none;stroke:#273747;stroke-width:1.7;marker-end:url(#arrow)} .node{fill:#f7fbff;stroke:#41566c;stroke-width:1.4}</style>
