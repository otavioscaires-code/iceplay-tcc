<text x="187.5" y="151" class="note" text-anchor="middle">PUT configuração ativa</text>
<path class="edge" d="M295 205H500"/>
<text x="397.5" y="196" class="note" text-anchor="middle">Persistir parâmetros</text>
<path class="edge" d="M900 260H295"/>
<text x="597.5" y="251" class="note" text-anchor="middle">POST leitura • Bearer e UUID</text>
<path class="edge" d="M295 315H500"/>
<text x="397.5" y="306" class="note" text-anchor="middle">Validar vínculo e UUID</text>
<path class="edge" d="M500 360H295"/>
<text x="397.5" y="351" class="note" text-anchor="middle">ID persistido ou existente</text>
<path class="edge" d="M295 405H900"/>
