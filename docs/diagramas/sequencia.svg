<path class="edge" d="M295 655H80"/>
<text x="187.5" y="646" class="note" text-anchor="middle">JSON da API</text>
<text x="30" y="746" class="note" text-anchor="start">Worker e POST são transações distintas. O fluxo foi ensaiado por cliente de software, não por placa física.</text>
