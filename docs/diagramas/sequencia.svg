<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="ICEPLAY sequência de ingestão e avaliação">
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#273747" stroke-width="1.2"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#152332} .title{font-size:23px;font-weight:bold} .heading{font-size:17px;font-weight:bold} .body{font-size:15px} .note{font-size:13px;fill:#46566a} .edge{fill:none;stroke:#273747;stroke-width:1.7;marker-end:url(#arrow)} .node{fill:#f7fbff;stroke:#41566c;stroke-width:1.4}</style>
<rect width="1000" height="800" fill="white"/>
