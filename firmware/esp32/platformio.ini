[platformio]
build_dir = ../../.tools/firmware-build

[env:esp32dev]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.5
build_flags = -Wall -Wextra

; Compila sempre com placeholders, mesmo se houver configuração privada local.
[env:verificacao]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DICEPLAY_USAR_EXEMPLO=1
